<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  body { width: 1000px; height: 560px; font-family: "Inter", "Segoe UI Variable", system-ui, sans-serif; }
  .stage { position: absolute; inset: 0; }
  .taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: rgba(28, 28, 30, .86);
    border-top: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(30px); display: flex; align-items: center; justify-content: flex-end; padding-right: 14px; gap: 4px; }
  .tray { display: flex; align-items: center; gap: 2px; padding: 0 6px; height: 40px; border-radius: 6px; }
  .tray .ico { width: 32px; height: 40px; display: grid; place-items: center; border-radius: 6px; }
  .tray .ico.on { background: rgba(255,255,255,.09); }
  .tray svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tray img { width: 18px; height: 18px; }
  .clock { text-align: right; font-size: 12px; line-height: 1.35; padding: 0 8px; }
  .menu { position: absolute; right: 190px; bottom: 58px; width: 300px; padding: 4px; border-radius: 8px;
    background: #2b2b2b; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 16px 40px rgba(0,0,0,.55); font-size: 14px; }
  .item { display: flex; align-items: center; height: 34px; padding: 0 12px 0 10px; border-radius: 4px; gap: 10px; }
  .item .chk { width: 16px; display: grid; place-items: center; }
  .item .chk svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 1.8; }
  .item .acc { margin-left: auto; color: rgba(255,255,255,.55); font-size: 12px; }
  .item.dim { color: rgba(255,255,255,.45); }
  .item.hover { background: rgba(255,255,255,.08); }
  .sep { height: 1px; background: rgba(255,255,255,.1); margin: 4px 0; }
</style>
<div class="stage">
  <div class="menu">
    <div class="item dim"><span class="chk"></span>Ponte 1.4.0</div>
    <div class="item"><span class="chk"></span>Abrir a Ponte</div>
    <div class="sep"></div>
    <div class="item"><span class="chk"></span>Sair da voz</div>
    <div class="item hover"><span class="chk"><svg viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7"/></svg></span>Silenciar microfone<span class="acc">Ctrl+Shift+M</span></div>
    <div class="item"><span class="chk"></span>Ensurdecer<span class="acc">Ctrl+Shift+D</span></div>
    <div class="item"><span class="chk"></span>Parar de transmitir a tela</div>
    <div class="sep"></div>
    <div class="item"><span class="chk"></span>Ajustes…</div>
    <div class="item"><span class="chk"></span>Procurar atualizações</div>
    <div class="sep"></div>
    <div class="item"><span class="chk"></span>Fechar a Ponte</div>
  </div>
  <div class="taskbar">
    <div class="tray">
      <span class="ico"><svg viewBox="0 0 16 16"><path d="M4 10l4-4 4 4"/></svg></span>
      <span class="ico on"><img src="../../src/renderer/icon.png" alt=""></span>
      <span class="ico"><svg viewBox="0 0 16 16"><path d="M1.5 6.5a9.5 9.5 0 0 1 13 0M4 9a6 6 0 0 1 8 0M6.5 11.5a2.4 2.4 0 0 1 3 0"/></svg></span>
      <span class="ico"><svg viewBox="0 0 16 16"><path d="M7.5 3.5 4.5 6H2v4h2.5l3 2.5zM10.5 6a3 3 0 0 1 0 4M12.5 4a6 6 0 0 1 0 8"/></svg></span>
    </div>
    <div class="clock">21:06<br>17/11/2026</div>
  </div>
</div>
