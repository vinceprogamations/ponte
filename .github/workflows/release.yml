# Gera o instalador e publica uma Release sempre que uma tag vX.Y.Z é enviada.
#   git tag v1.0.1 && git push origin v1.0.1
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar instalador
        run: npm run dist

      - name: Publicar release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Ponte-Instalar.exe --clobber
          else
            gh release create "$TAG" dist/Ponte-Instalar.exe \
              --title "Ponte $TAG" \
              --notes-file .github/release-notes.md
          fi
